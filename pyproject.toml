[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qadapt"
version = "0.1.0"
description = "Q-ADAPT: hybrid quantum-classical adaptive cyber-defense optimization using ML-driven attack graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Q-ADAPT Research Team" }]
keywords = ["cybersecurity", "attack-graph", "QUBO", "QAOA", "quantum-optimization", "intrusion-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14"]
xgboost = ["xgboost>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.4"]
report = ["matplotlib>=3.7"]
all = ["qadapt[quantum,xgboost,api,dev,report]"]

[project.scripts]
qadapt = "qadapt.cli:main"

[tool.setuptools.packages.find]
include = ["qadapt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
